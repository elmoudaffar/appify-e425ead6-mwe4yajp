<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OselFit Ai</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#2b4fa8;color:#fff;font-family:system-ui,sans-serif;text-align:center}button{margin-top:16px;padding:12px 24px;border:0;border-radius:8px;font-size:16px}</style></head>
<body><div><h1 id="t">OselFit Ai</h1><p id="m"></p><button id="b" style="display:none">Try again</button></div>
<script>
var URL_="https://oselfit.chantan.one", OFFLINE=true;
function go(){ if(navigator.onLine){ location.replace(URL_) } else { show() } }
function show(){
  document.getElementById("m").textContent = OFFLINE ? "You're offline. Reconnect to continue." : "No internet connection.";
  document.getElementById("b").style.display = "inline-block";
}
document.getElementById("b").onclick = go;
window.addEventListener("online", go);
go();
</script></body></html>
